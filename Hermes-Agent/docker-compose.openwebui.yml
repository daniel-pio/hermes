services:
  openwebui:
    # Same immutable image as the installation used to validate this integration.
    image: openwebui/open-webui@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
    container_name: ${OPEN_WEBUI_CONTAINER:-hermes-open-webui}
    restart: unless-stopped
    environment:
      WEBUI_AUTH: "true"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Generated by the installer}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?Generated by the installer}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?Generated by the installer}
      WEBUI_ADMIN_NAME: "Administrador Hermes"
      ENABLE_SIGNUP: "false"
      ENABLE_OLLAMA_API: "false"
      # Administrators can add Gemini and other OpenAI-compatible providers for tests.
      ENABLE_OPENAI_API: "true"
      DEFAULT_LOCALE: "pt-BR"
      DEFAULT_MODELS: "hermes_chromium_pool3"
      ENABLE_VERSION_UPDATE_CHECK: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPEN_WEBUI_BIND_ADDRESS:-0.0.0.0}:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - openwebui_data:/app/backend/data
    mem_limit: "3g"
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=10)"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 90s

volumes:
  openwebui_data:
